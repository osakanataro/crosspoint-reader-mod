# CodeRabbit settings for this fork. Daily work lands on vertical-1.6.5; about once a day a PR
# from it into the default branch vertical-1.6.5review is reviewed here, then the default branch
# is fast-forwarded to the reviewed head.
language: ja-JP
reviews:
  auto_review:
    enabled: true
  path_filters:
    # The development log, and a header generated by scripts/build_clock_digits.py.
    - "!README.md"
    - "!src/images/ClockDigits.h"
