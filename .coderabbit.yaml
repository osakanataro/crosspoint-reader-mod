# CodeRabbit settings for this fork. Daily work lands on vertical-2.0.0; a PR from it into the
# default branch vertical-2.0.0review is reviewed here, then the default branch is fast-forwarded
# to the reviewed head.
language: ja-JP
reviews:
  auto_review:
    enabled: true
  path_filters:
    # The development logs (README.md and the pre-1.6.5 history it was split into), and a header
    # generated by scripts/build_clock_digits.py.
    - "!README.md"
    - "!CHANGELOG-OST.md"
    - "!src/images/ClockDigits.h"
    # Screenshot baselines and books for scripts/sim_regress.py.
    - "!test/sim-regress/**"
